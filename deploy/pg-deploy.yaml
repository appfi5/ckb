apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-testnet
  labels:
    app: pg-testnet
spec:
  serviceName: pg-testnet
  replicas: 1 # Scale as match as you want
  selector:
    matchLabels:
      app: pg-testnet
  template:
    metadata:
      labels:
        app: pg-testnet
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      restartPolicy: Always
      containers:
        - name: pg
          image: registry.devops.rivtower.com/ckb-explorer/postgres:16.10
          env:
          - name: POSTGRES_PASSWORD
            value: "123456"
          - name: POSTGRES_USER
            value: "postgres"
          - name: PGDATA
            value: "/var/lib/postgresql/data/pgdata"
          command:
          - "postgres"
          - "-c"
          - "max_connections=300"
          - "-c"
          - "wal_level=logical"
          ports:
          - containerPort: 5432
            name: pg
            protocol: TCP
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data/pgdata
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: nfs-client
        resources:
          requests:
            storage: 500Gi

---

apiVersion: v1
kind: Service
metadata:
  name: pg-testnet-svc
  labels:
    app: pg-testnet
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: pg
  selector:
    app: pg-testnet
